name: Deploy web

# Publishes the playable browser build to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: GitHub Actions.
# Until Pages is enabled the workflow stays green and only emits a warning.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'shaders/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages: ${{ steps.status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build for project pages
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Report Pages status
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages not enabled::Enable it once in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi
        id: status

      - name: Upload Pages artifact
        if: steps.status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
