name: panda_runner
description: >-
  Panda Runner - a 3D neon parkour runner built with Flutter Scene
  (Flutter GPU + WebGL2). Drop into Shibuya Scramble Crossing as a neon panda,
  weave through traffic, grind the Yamanote rails, light up the city and reach
  Shibuya Stream on a rooftop finish. Runs on Android, iOS, macOS, Windows and the web.
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/speed_lines.frag
    - shaders/vignette.frag
  assets:
    - assets/data/
    - assets/models/
    - assets/audio/
    - assets/sfx/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 800
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-sub-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-sub-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSansJP-sub-900.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
